<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoQuiz - Mapas Interactivos</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-2.css">
</head>
<body>

    <div id="menu-principal" class="pantalla-completa">
        <h1>🌎 GeoQuiz</h1>
        <p>Selecciona un mapa para comenzar:</p>
        <div class="grid-mapas" id="grid-mapas">
            </div>
    </div>

    <div id="modal-modo" class="modal hidden">
        <div class="modal-contenido">
            <h2 id="titulo-modal-modo">¿Cómo quieres jugar?</h2>
            <div class="botones-modo">
                <button class="btn-modo" onclick="seleccionarModo('nombres')">
                    🗺️ Por Nombres
                </button>
                <button class="btn-modo" onclick="seleccionarModo('cabeceras')">
                    📍 Por Cabeceras
                </button>
            </div>
            <button class="btn-volver-modal" onclick="volverAlMenu()">Cancelar</button>
        </div>
    </div>

    <div id="juego-container" class="hidden">
        <header>
            <button class="btn-volver" onclick="volverAlMenu()">⬅ Menú</button>
            <div class="info-juego">
                <div class="pregunta-box">
                    <span id="texto-instruccion">Encuentra:</span>
                    <h2 id="pregunta-actual">Cargando...</h2>
                </div>
                <div class="puntaje-box">
                    <span id="aciertos">0</span> / <span id="total-regiones">0</span>
                </div>
            </div>
        </header>

        <div id="map"></div>

        <div class="progreso-container">
            <div id="barra-progreso" class="barra"></div>
        </div>

        <div id="feedback" class="hidden"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script-4.js"></script>
</body>
</html>
