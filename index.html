<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoQuiz Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="fixed-hud" class="hud-bar" style="display: none;">
        <button id="btn-pause" class="btn-icon"><i class="fas fa-pause"></i></button>
        <div class="hud-info">
            <div id="question-text" class="hud-question">Preparando...</div>
        </div>
        <div class="hud-stats">
            <span id="hud-correct">0</span> ✅ | <span id="hud-percent">0%</span> | <i class="far fa-clock"></i> <span id="timer-display">0:00</span>
        </div>
    </div>

    <div id="screen-start" class="screen">
        <div class="hero-content">
            <h1>🌎 GeoQuiz</h1>
            <p>Domina la geografía del mundo de forma interactiva.</p>
            <div class="main-actions">
                <button id="go-learn" class="btn-lg btn-secondary"><i class="fas fa-book-open"></i> Aprender</button>
                <button id="go-play" class="btn-lg btn-primary"><i class="fas fa-play"></i> Jugar</button>
            </div>
            <div class="sub-actions">
                <button id="show-achievements" class="btn-text"><i class="fas fa-trophy"></i> Logros</button>
                <button id="btn-theme" class="btn-text"><i class="fas fa-moon"></i> Tema</button>
            </div>
        </div>
    </div>

    <div id="screen-regions" class="screen hidden">
        <header class="screen-header" style="padding: 20px;">
            <button id="back-to-start"><i class="fas fa-chevron-left"></i> Volver</button>
            <h2>Selecciona un territorio</h2>
        </header>
        <div class="regions-grid" style="padding: 0 20px; overflow-y: auto;">
            <h3>Países</h3>
            <div class="grid-row">
                <button class="reg-sel card" data-region="ar" data-type="country">
                    <img src="flags/ar.png" width="50" alt="AR"> <span>Argentina</span>
                </button>
                <button class="reg-sel card" data-region="br" data-type="country">
                    <img src="flags/br.png" width="50" alt="BR"> <span>Brasil</span>
                </button>
                <button class="reg-sel card" data-region="ca" data-type="country">
                    <img src="flags/ca.png" width="50" alt="CA"> <span>Canadá</span>
                </button>
            </div>
            <h3>Subdivisiones</h3>
            <div class="grid-row">
                <button class="reg-sel card" data-region="ar-tucuman" data-type="subdivision"><span>Tucumán</span></button>
                <button class="reg-sel card" data-region="br-santacatarina" data-type="subdivision"><span>Sta. Catarina</span></button>
                <button class="reg-sel card" data-region="ca-bc" data-type="subdivision"><span>British Columbia</span></button>
            </div>
        </div>
    </div>

    <div id="screen-modes" class="screen hidden">
        <div class="modal-center">
            <h2>Elige el desafío</h2>
            <div class="modes-list">
                <button class="mode-sel btn-lg btn-secondary" data-mode="names">Nombres</button>
                <button class="mode-sel btn-lg btn-secondary" data-mode="capitals">Capitales</button>
                <button id="btn-mode-flags" class="mode-sel btn-lg btn-secondary" data-mode="flags">Banderas</button>
            </div>
            <button id="back-to-regions" class="btn-text" style="margin-top:20px;">Atrás</button>
        </div>
    </div>

    <div id="screen-game" class="screen hidden">
        <div id="map"></div>
    </div>

    <div id="modal-pause" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>Pausa</h2>
            <button id="resume-game" class="btn-lg btn-primary">Continuar</button>
            <button id="exit-game" class="btn-text">Salir al inicio</button>
        </div>
    </div>

    <div id="modal-gameover" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 id="end-title">¡Fin!</h2>
            <p id="end-score" style="font-size: 2rem; font-weight: bold;"></p>
            <p id="end-time"></p>
            <button id="btn-end-home" class="btn-lg btn-primary">Inicio</button>
        </div>
    </div>

    <div id="modal-achievements" class="modal-overlay hidden">
        <div class="modal-box wide-box">
            <h2>Logros Obtenidos</h2>
            <div id="achievements-grid" style="max-height: 400px; overflow-y: auto;"></div>
            <button id="close-ach" class="btn-text">Cerrar</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
