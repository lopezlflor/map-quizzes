<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Quizzes</title>

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="theme-light">

<header>
  <button id="btn-theme" class="icon-btn"><i class="fas fa-sun"></i></button>
  <h1>Map Quizzes</h1>
  <button id="show-achievements" class="icon-btn"><i class="fas fa-trophy"></i></button>
</header>

<main>

  <section id="screen-start" class="screen">
    <h2>¿Qué quieres hacer?</h2>
    <div class="menu-grid big-menu">
      <button id="go-learn" class="menu-btn primary">Aprender</button>
      <button id="go-play" class="menu-btn primary">Jugar</button>
    </div>
  </section>

  <section id="screen-modes" class="screen hidden">
    <h2>Selecciona modo</h2>
    <div class="menu-grid big-menu">
      <button class="menu-btn mode-sel" data-mode="names">Nombres</button>
      <button class="menu-btn mode-sel" data-mode="capitals">Capitales</button>
      <button class="menu-btn mode-sel" data-mode="flags">Banderas</button>
    </div>
    <button id="back-to-start" class="btn-back">Volver</button>
  </section>

  <section id="screen-regions" class="screen hidden">
    <h2>Selecciona país</h2>
    <div class="menu-grid big-menu">
      <button class="menu-btn reg-sel" data-region="ar">
        <img src="flags/ar.png" class="flag-btn"> Argentina
      </button>
      <button class="menu-btn reg-sel" data-region="br">
        <img src="flags/br.png" class="flag-btn"> Brasil
      </button>
      <button class="menu-btn reg-sel" data-region="ca">
        <img src="flags/ca.png" class="flag-btn"> Canadá
      </button>
    </div>
    <button id="back-from-regions" class="btn-back">Volver</button>
  </section>

  <section id="screen-game" class="screen hidden">
    <div id="map"></div>
    </section>

</main>

<div id="fixed-hud">
  <div>
    <div id="question-text"></div>
    <div class="hud-stats">
      <span id="hud-progress">0/0</span> |
      <span id="hud-correct">0</span> |
      <span id="hud-percent">0%</span> |
      <span id="timer-display">0:00</span>
    </div>
  </div>
  <button id="btn-pause" class="icon-btn"></button>
</div>

<div id="modal-pause" class="modal hidden">
  <div class="modal-content">
    <h2>Pausa</h2>
    <button id="resume-game" class="menu-btn">Continuar</button>
    <button id="restart-game" class="menu-btn">Reiniciar</button>
    <button id="exit-game" class="menu-btn danger">Salir</button>
  </div>
</div>

<div id="modal-gameover" class="modal hidden">
  <div class="modal-content">
    <h2>¡Partida Terminada!</h2>
    <p>Aciertos: <strong id="end-score"></strong></p>
    <p>Tiempo total: <strong id="end-time"></strong></p>
    <button id="btn-end-home" class="menu-btn primary">Volver al Menú</button>
  </div>
</div>

<div id="modal-achievements" class="modal hidden">
  <div class="modal-content">
    <h2>Logros</h2>
    <div id="achievements-list">(Próximamente)</div>
    <button id="close-ach" class="btn-back">Cerrar</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
